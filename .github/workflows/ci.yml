name: CI

# Runs on every branch, not just main: the development loop is local edit →
# push → verify, because the workstation cannot run the Docker-backed suites
# (see docs/architecture/deployment.md). A branch with no CI run has no
# verification at all, which is how a green local subset gets mistaken for a
# green gate.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A new push supersedes the run it interrupts. Without this, frequent pushes
# queue behind results nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    services:
      # Real S3-compatible service for the object-storage integration suite
      # (ADR-0017: infrastructure tests run against real services, never skipped).
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        command: server /data

      # Local SMTP catcher for the email-sender integration suite.
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
        options: >-
          --health-cmd "wget -qO- http://localhost:8025/readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_ACCESS_KEY: minioadmin
      S3_TEST_SECRET_KEY: minioadmin
      S3_TEST_BUCKET: dxdoc-test-bucket
      SMTP_TEST_HOST: 127.0.0.1
      SMTP_TEST_PORT: '1025'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Before `npm ci`, not after: a lockfile pointing at an unreachable
      # mirror makes npm hang on the socket and exit with "Exit handler never
      # called!", which reads as an npm bug and sends you looking at Node
      # versions. Needs no dependencies, so it can run first and say what is
      # actually wrong.
      - name: Lockfile registry
        run: npm run lockfile:check

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Documentation links
        run: npm run docs:check-links

      - name: Documentation index
        run: npm run docs:check-index

      # Coverage replaces a bare `npm test` rather than running alongside it:
      # the suite is the slow part, and running it twice buys nothing.
      - name: Unit and integration tests
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    # The suite Playwright drives is the one the workstation cannot run:
    # browsers, a real server, MinIO and an SMTP catcher at once. M1.15's exit
    # criterion is a Playwright test, so without this job that criterion is
    # unverifiable anywhere.
    services:
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        command: server /data

      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
        options: >-
          --health-cmd "wget -qO- http://localhost:8025/readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_ACCESS_KEY: minioadmin
      S3_TEST_SECRET_KEY: minioadmin
      S3_TEST_BUCKET: dxdoc-test-bucket
      SMTP_TEST_HOST: 127.0.0.1
      SMTP_TEST_PORT: '1025'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Duplicated from `quality` rather than inherited: this job has no `needs`
      # so it starts in parallel, and without the check here its `npm ci` fails
      # with the same misleading error. (`image` needs `quality`, so it is
      # already covered.)
      - name: Lockfile registry
        run: npm run lockfile:check

      - run: npm ci

      # Locally the `minio-init` compose service creates this bucket; the
      # Vitest S3 suite creates and drops its own. Neither runs here, so the
      # E2E bucket has to be created explicitly or the server fails to boot.
      # The AWS CLI is preinstalled on GitHub-hosted runners.
      - name: Create the E2E object-storage bucket
        run: aws --endpoint-url "$S3_TEST_ENDPOINT" s3 mb "s3://$S3_TEST_BUCKET"
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1

      # The client has to be built before the suite runs. `composition-root.ts`
      # registers @fastify/static and the SPA fallback only `if (existsSync(dist))`,
      # so without a build the server boots fine but answers 404 on every page
      # route — and Playwright's webServer only treats 200-399 as ready. The
      # result is a 180s timeout with the process alive, no test ever started and
      # no `test-results/` to upload, which is exactly how this job first failed.
      #
      # `npm run build` runs typecheck again (the `quality` job already does),
      # which costs about a minute. Kept anyway: this job has no `needs` so it
      # cannot inherit that artifact, and building by any other command would
      # mean the E2E suite exercises a build nothing else produces.
      - name: Build
        run: npm run build

      # playwright.config.ts leaves PLAYWRIGHT_CHANNEL unset in CI so the
      # pinned bundled build is used rather than a system browser.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # `set -o pipefail` is not on by default: without it the step's exit code
      # would be tee's, and a red suite would report green.
      - name: End-to-end tests
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e-output.log

      # Two channels, because they reach different readers.
      #
      # The step summary renders in the web UI, which is where a person looks.
      # It is NOT readable through the API: `GET /check-runs/{id}` comes back
      # with `output` null for Actions jobs (measured, not assumed).
      - name: Publish the failure tail
        if: failure()
        run: |
          {
            echo '## End-to-end failure'
            echo
            echo '```'
            tail -n 150 e2e-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # An `::error::` workflow command becomes a check-run annotation, and
      # annotations *are* public through the API — no repository admin rights,
      # which downloading a job log does require. So this is the only failure
      # detail readable from a plain clone. Newlines have to be percent-encoded
      # or the message stops at the first one.
      - name: Report the failure tail as an annotation
        if: failure()
        run: |
          body=$(tail -n 40 e2e-output.log | tail -c 3000)
          body="${body//'%'/'%25'}"
          body="${body//$'\n'/'%0A'}"
          body="${body//$'\r'/'%0D'}"
          echo "::error title=End-to-end output::$body"

      # `trace: 'retain-on-failure'` is already configured, so a failed run
      # leaves a trace here. Download it and open it locally with
      # `npx playwright show-trace <file>` — no Docker needed to debug.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  image:
    name: Reference image
    runs-on: ubuntu-latest
    needs: quality

    # Nothing verified that the Dockerfile builds: `npm run build` covers the
    # client bundle, not the image, so the M0.6 reference stack could be broken
    # with CI green. Building it here closes that gap and produces the artefact
    # the MVP environment pulls — the deployment target never compiles, because
    # `npm ci` there means node-gyp rebuilding better-sqlite3 and bcrypt.
    #
    # Gated on `quality` only for now. Add `e2e` once that job has a track
    # record, so a new job's teething problems do not mask the build signal.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests build to verify, and push nothing: a fork's token
          # cannot write packages, and an unreviewed image should not be
          # publishable anyway.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
