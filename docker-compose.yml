# Local development services that pair with the app running on the host
# (`npm run dev`). The application is not containerised in R0 (M0.6 reference
# stack); these are the external services it talks to:
#   - mailpit: local SMTP catcher (self-hosted stand-in for Mailtrap). Any mail
#     the app sends lands here instead of a real inbox. SMTP on :1025, web UI
#     at http://localhost:8025.
#   - minio: S3-compatible object storage for local development and the
#     object-storage integration tests.
# Start:  docker compose up -d
services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
